name: Build and package

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
          - os: windows-2025
            label: windows-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        shell: bash
        run: ./mvnw -B verify
      - name: Prepare runtime application image
        shell: bash
        run: |
          mkdir -p target/package-input target/dist
          cp target/rtis-lab-suite-0.1.0-SNAPSHOT.jar target/package-input/rtis-lab-suite.jar
          jpackage --type app-image --name "RTIS Lab Suite" --input target/package-input \
            --main-jar rtis-lab-suite.jar --main-class ru.ilyaandreev.rtis.Launcher --dest target/dist
      - uses: actions/upload-artifact@v4
        with:
          name: rtis-lab-suite-${{ matrix.label }}
          path: target/dist/**
          if-no-files-found: error
